<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام الاشتراك - {{ lead.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .checkout-card {
            max-width: 500px;
            margin: 50px auto;
            border-radius: 15px;
            border: none;
        }

        .price-tag {
            font-size: 1.5rem;
            color: #198754;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card checkout-card shadow-lg">
            <div class="card-header bg-primary text-white text-center py-4" style="border-radius: 15px 15px 0 0;">
                <h3>طلب اشتراك خدمات المطعم</h3>
                <p class="mb-0">{{ lead.name }}</p>
            </div>
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <h5 class="text-muted">عرض رمضان للمطاعم</h5>
                    <div class="price-tag">10,000 ج.م <span class="text-muted fs-6">/ سنويًا</span></div>
                    <ul class="list-unstyled mt-2 text-muted">
                        <li>✓ موقع إلكتروني كامل</li>
                        <li>✓ منيو QR ذكي</li>
                        <li>✓ استقبال طلبات بدون عمولة</li>
                    </ul>
                </div>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">اسم المسؤول / المالك</label>
                        <input type="text" name="customer_name" class="form-control" required placeholder="الاسم ثلاثي">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">رقم الهاتف للتواصل</label>
                        <input type="tel" name="customer_phone" class="form-control"
                            value="{{ lead.contact_details.phone_primary }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">خطة الاشتراك</label>
                        <select name="plan" class="form-select">
                            <option value="ramadan_offer">عرض رمضان الشامل (10,000 ج.م)</option>
                        </select>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-success btn-lg">تأكيد الطلب والدفع</button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center text-muted py-3">
                <small>سيتم التواصل معكم لتفعيل الخدمة فورًا</small>
            </div>
        </div>
    </div>

</body>

</html>
