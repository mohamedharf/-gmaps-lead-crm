<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم الشراء بنجاح</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .success-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 3rem;
            max-width: 600px;
            text-align: center;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        .success-icon i {
            font-size: 3rem;
            color: white;
        }

        h1 {
            color: #2d3748;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .message {
            font-size: 1.25rem;
            color: #4a5568;
            line-height: 1.8;
            margin-bottom: 2rem;
        }

        .info-box {
            background: #f7fafc;
            border-right: 4px solid #667eea;
            padding: 1.5rem;
            border-radius: 10px;
            text-align: right;
            margin-top: 2rem;
        }

        .info-box .label {
            color: #718096;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .info-box .value {
            color: #2d3748;
            font-size: 1.1rem;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="success-card">
        <div class="success-icon">
            <i class="bi bi-check-circle-fill"></i>
        </div>

        <h1>تم الشراء بنجاح! 🎉</h1>

        <div class="message">
            <p class="mb-3">تم شراء <strong>موقعكم لإدارة المطاعم</strong> بنجاح.</p>
            <p class="mb-0">سوف يتم التفعيل في خلال <strong>24 ساعة</strong> وإبلاغكم.</p>
        </div>

        {% if order %}
        <div class="info-box">
            <div class="row">
                <div class="col-6 mb-3">
                    <div class="label">رقم الطلب</div>
                    <div class="value">#{{ order.id }}</div>
                </div>
                <div class="col-6 mb-3">
                    <div class="label">المبلغ المدفوع</div>
                    <div class="value">{{ order.price }} {{ order.currency }}</div>
                </div>
                <div class="col-12">
                    <div class="label">اسم المطعم</div>
                    <div class="value">{{ order.customer_name }}</div>
                </div>
            </div>
        </div>
        {% endif %}

        <div class="mt-4 text-muted small">
            <i class="bi bi-shield-check me-2"></i>
            عملية آمنة ومشفرة بواسطة Paymob
        </div>
    </div>
</body>

</html>
